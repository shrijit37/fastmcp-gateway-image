name: build

# Publishes the gateway image. Nothing here deploys: the Dokploy app
# (`fastmcp-gateway`, A9F6GcGMBXzeQl2V5foFh) is still build-sourced, and this
# Dokploy build (v0.30.8) does not honour a docker-provider switch on an app
# created from a git source, so a deploy job here would only rebuild that
# app's server-side Dockerfile and then fail the SHA gate. See DEPLOY.md
# ("Cutover not finished") for the evidence and the remaining manual step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Both platforms: the Dokploy host is linux/arm64.
          platforms: linux/amd64,linux/arm64
          push: true
          # APP_VERSION is the identity /healthz reports, so whichever container
          # ends up running can be checked against a commit.
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
